<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยินดีต้อนรับสู่เว็บไซต์ของฉัน</title>
  <style>
    /* ตั้งค่าพื้นฐานและฟอนต์ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* กล่องการ์ดตรงกลางหน้าจอ */
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    /* รูปโปรไฟล์วงกลม */
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      font-size: 36px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1e293b;
    }

    .subtitle {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 20px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 28px;
    }

    /* ปุ่มลิงก์ */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 12px 20px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }

    .btn-outline {
      background-color: transparent;
      color: #2563eb;
      border: 1.5px solid #2563eb;
    }

    .btn-outline:hover {
      background-color: #eff6ff;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">ME</div>
    <h1>สวัสดี, ยินดีต้อนรับ!</h1>
    <div class="subtitle">Web Developer &amp; Creator</div>
    
    <p>
      นี่คือหน้าเว็บไซต์แรกของฉันที่โฮสต์ฟรีบน GitHub Pages 
      สามารถใช้หน้านี้เป็นหน้าแนะนำตัว รวมลิงก์ติดต่อ หรือโชว์ผลงานได้ทันที
    </p>

    <div class="links">
      <a href="https://github.com" target="_blank" class="btn">ดูโปรไฟล์ GitHub ของฉัน</a>
      <a href="mailto:example@email.com" class="btn btn-outline">ส่งอีเมลติดต่อ</a>
    </div>

    <footer>
      © 2026 Hosted with GitHub Pages
    </footer>
  </div>

</body>
</html>
